<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Typing</title>
        <!-- Font Awesome CDN for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
        <link rel="stylesheet" href="./index.css" />
        <style>
            #datetime {
                text-align: center;
                margin-bottom: 1rem;
                font-size: 1.1rem;
                color: #2d7c6f;
            }

            #datetime .fas {
                margin-right: 0.3rem;
                color: #3a241d;
                font-size: 1.1em;
                vertical-align: middle;
            }

            /* Hide label visually but keep for accessibility */
            .hidden-label {
                position: absolute;
                left: -10000px;
                top: auto;
                width: 1px;
                height: 1px;
                overflow: hidden;
            }
        </style>
    </head>

    <body>
        <h1>
            <i class="fas fa-keyboard"></i> Practice your typing
        </h1>
        <div id="datetime">
            <i class="fas fa-calendar-day"></i>
            <span id="current-date"></span>
            &nbsp;|&nbsp;
            <i class="fas fa-clock"></i>
            <span id="current-time"></span>
        </div>
        <div>
            <i class="fas fa-info-circle"></i>
            Click start to have a quote displayed. Type the quote as fast as you can!
        </div>

        <p id="quote"></p>
        <p id="message"></p>
        <div>
            <label for="typed-value" class="hidden-label">Current word</label>
            <input type="text" aria-label="current word" id="typed-value" placeholder="Type here..." />
            <i class="fas fa-pen"></i>
        </div>
        <div>
            <button id="start" type="button">
                <i class="fas fa-play"></i> Start
            </button>
        </div>
        <script src="./clock.js"></script>
        <script src="./typing-logic.js"></script>
        <script src="./index.js"></script>
        <script>
            function updateDateTime() {
                const formatted = formatClock(new Date());
                document.getElementById('current-date').textContent = formatted.date;
                document.getElementById('current-time').textContent = formatted.time;
            }

            updateDateTime();
            setInterval(updateDateTime, 60000);
        </script>
    </body>
</html>
