name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bank API lint
        working-directory: 7-bank-project/api
        run: |
          npm ci
          npm run lint

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build the carbon extension
        working-directory: 5-browser-extension/solution
        run: |
          npm ci
          npm test
          npm run build

  chat-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chat API tests
        working-directory: 9-chat-project/solution/backend/python
        run: |
          python -m pip install --upgrade pip
          pip install openai fastapi uvicorn python-dotenv httpx
          python -m unittest test_api.py
